; FUD firmware (Find Unwelcome Devices) - M5Stack StickS3 + Pingequa RF Pack S3
; Single hardware combo.
;   pio run -e sticks3        release. Read-only bench telemetry: state, shot, ver, help.
;   pio run -e sticks3-dev    adds FUD_BENCH: the "fake <kind>" detection injector.

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/cu.usbmodem31101
monitor_port = /dev/cu.usbmodem31101
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
lib_deps =
  m5stack/M5Unified
  h2zero/NimBLE-Arduino @ ^2.2.0
  crankyoldgit/IRremoteESP8266 @ ^2.8.6

; Bench build: everything in sticks3 plus the detection injector (telem "fake").
[env:sticks3-dev]
extends = env:sticks3
build_flags =
  ${env:sticks3.build_flags}
  -DFUD_BENCH=1

; Radio stability test: replaces setup/loop with a harness that runs radio combinations
; concurrently (no display, no alerts, no sound) and heartbeats over USB. Diagnostic only.
[env:sticks3-radiotest]
extends = env:sticks3
build_flags =
  ${env:sticks3.build_flags}
  -DFUD_RADIOTEST=1

; Animation-alone test: radios off, continuous full-screen spin at 160 then 240 MHz. Diagnostic.
[env:sticks3-animtest]
extends = env:sticks3
build_flags =
  ${env:sticks3.build_flags}
  -DFUD_ANIMTEST=1
